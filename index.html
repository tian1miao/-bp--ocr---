<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>王者荣耀极客 BP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>王者荣耀极客 BP</h1>

    <!-- 模式一：BP 咨询 -->
    <div class="card">
      <h3>模式一：BP 咨询 (残局推荐)</h3>
      <div class="hint">上传未选完的截图，系统自动识别并推荐我方剩余优选英雄。</div>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="file" id="upload-consult" accept="image/png, image/jpeg" style="flex: 1; padding: 5px;" />
        <button id="btn-consult" class="btn primary" style="width: 100px; margin: 0;">推荐</button>
      </div>
    </div>

    <!-- 模式二：胜率预测 -->
    <div class="card">
      <h3>模式二：胜率预测 (终局分析)</h3>
      <div class="hint">上传10人已选定的截图，获取深度对局与出装分析。</div>
      <div class="form-row" style="margin-top: 10px;">
        <label style="width: 80px;">你的分路</label>
        <select id="my-pos-select">
          <option value="">(必选) 请选择你的分路</option>
          <option>对抗路</option><option>中路</option><option>发育路</option><option>打野</option><option>辅助</option>
        </select>
      </div>
      <div style="display: flex; gap: 10px;">
        <input type="file" id="upload-predict" accept="image/png, image/jpeg" style="flex: 1; padding: 5px;" />
        <button id="btn-predict" class="btn" style="width: 100px; margin: 0; background: #2e7d32; color: white;">分析</button>
      </div>
    </div>

    <div class="status" id="status-text"></div>

    <div class="card" id="rec-card" style="display:none;">
      <h3>补位推荐</h3>
      <div id="rec-content"></div>
    </div>

    <div class="card" id="log-card">
      <h3>数据分析</h3>
      <pre id="log-output">请在上方上传截图开始分析...</pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
